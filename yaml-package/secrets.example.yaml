# Template for config/secrets.yaml
#
# Only needed for the YAML package in this directory. The custom integration
# asks for the address in the UI and stores it in .storage instead.
#
# Copy these three lines into your own config/secrets.yaml and fill in the
# real values. This file stays blank so it can be committed safely.

# Where status.xml lives.
#   IPv4: "http://192.168.0.100/status.xml"
#   IPv6: "http://[fd00::1]/status.xml"   -- brackets are required
giom_status_url: "http://<station-ip>/status.xml"

# The bare address, for SNMP. No scheme, no port.
giom_host: "<station-ip>"

# SNMP community. "public" from the factory; change it here if you changed it
# on the station's own configuration page.
giom_community: "public"
